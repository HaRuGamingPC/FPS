  body {

  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qbtns { display: flex; gap: 8px; }
  .qbtns button { margin: 0; background: #10151c; border: 1px solid var(--line); }
  .qbtns button.on { background: var(--accent); border-color: var(--accent); }
  .fps { font-size: 56px; font-weight: 800; line-height: 1; margin: 6px 0 10px; }
  .fps span { font-size: 16px; color: var(--muted); margin-left: 6px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .ok { background: #143524; color: var(--ok); }
  .warn { background: #3a3014; color: var(--warn); }
  .bad { background: #3a1818; color: var(--bad); }
  .note { color: var(--muted); font-size: 13px; line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .hit { color: var(--ok); font-weight: 700; }
  .miss { color: var(--bad); }

<main>
  <h1>ゲームFPS検索 Ver.1.0.2 <a href="https://x.com/HaRuGamingPC" target="_blank" rel="noopener">@HaRuGamingPC</a></h1>
  <p class="lead">タイトル・目標fps・解像度から、平均の見積もりと「そのfpsを超える組み合わせ」を出す。数字も計算もこのファイルの中だけ。ダウンロード後はネット不要。</p>

    <section class="card">
      <div class="tabs">
        <button type="button" id="tabFwd" class="on">スペックからfps</button>

      </div>
      <label>タイトル</label>
      <select id="game"></select>
      <div id="fwdFields">
        <label>CPU検索</label>
        <input id="qCpu" placeholder="7800X3D, 5700X..." />

      <label>画質</label>

      <div class="suggest" id="suggest"></div>

const $ = id => document.getElementById(id);
let mode = "fwd";

function fill(sel, items, q) {
  const cur = sel.value;
  const query = (q || "").toLowerCase();
  const list = items.filter(i => !query || (i.name + (i.g || "") + (i.kind || "")).toLowerCase().includes(query));
  sel.innerHTML = "";
  const groups = [];
  list.forEach(i => { const key = i.g || i.kind || ""; if (!groups.includes(key)) groups.push(key); });
  groups.forEach(g => {
    const og = document.createElement("optgroup");
    og.label = g || "その他";
    list.filter(i => (i.g || i.kind || "") === g).forEach(i => og.appendChild(new Option(i.name, i.id)));
    sel.appendChild(og);
  });
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  else if (sel.options.length) sel.selectedIndex = 0;
}

function resMul(game) {
  const r = $("res").value;
  return r === "2160" ? game.r4k : r === "1440" ? game.r1440 : 1;
}
function calc(game, cpu, gpu) {
  const q = $("preset").value;
  const quality = q === "high" ? game.high : q === "mid" ? (1 + game.high) / 2 : 1;
  const ram = Number($("ram").value) === 16 ? 0.97 : 1;
  const gpuFps = game.gpu * (gpu.s / 240) * resMul(game);
  const cpuBoost = $("res").value === "1080" ? 1 : 1.04;
  const cpuFps = game.cpu * cpu.f * cpuBoost;
  let avg = Math.min(gpuFps, cpuFps, game.cap) * quality;
  avg = Math.round(avg * ram);
  const low = Math.round(avg * game.lowR * (Number($("ram").value) === 16 ? 0.94 : 1));
  const bound = gpuFps < cpuFps - 8 ? "GPU" : cpuFps < gpuFps - 8 ? "CPU" : "ほぼ均衡";
  return { avg, low, bound, gpuFps: Math.round(gpuFps * quality), cpuFps: Math.round(cpuFps) };
}
function verdict(avg, low, target) {
  if (avg >= target * 1.12 && low >= target * 0.85) return ["余裕", "ok"];
  if (avg >= target && low >= target * 0.72) return ["平均は届く。混戦は割れる", "warn"];
  return ["目標未達", "bad"];
}
function renderForward() {
  const game = games.find(g => g.id === $("game").value);
  const cpu = cpus.find(c => c.id === $("cpu").value);
  const gpu = gpus.find(g => g.id === $("gpu").value);
  if (!game || !cpu || !gpu) return;
  const target = Number($("target").value) || 244;
  const r = calc(game, cpu, gpu);
  const [label, cls] = verdict(r.avg, r.low, target);
  $("outTitle").textContent = game.name + " の見積もり";
  $("avg").innerHTML = r.avg + " <span>fps</span>";
  $("low").textContent = r.low + " fps";
  $("bound").textContent = r.bound + "（GPU側 " + r.gpuFps + " / CPU側 " + r.cpuFps + "）";
  $("gap").textContent = (r.avg - target >= 0 ? "+" : "") + (r.avg - target) + " fps";
  $("lock").textContent = label;
  $("badge").className = "badge " + cls;
  $("badge").textContent = label;
  $("note").textContent = "エンジン上限は約" + game.cap + "fps。マップと人数で±20〜30%は動く。16GBは終盤の揺れを少し割引。";
  const hits = gpus.map(g => ({ g, r: calc(game, cpu, g) })).filter(x => x.r.avg >= target);
  $("suggest").innerHTML = "<h2>このCPUで目標を超えるGPU</h2>" + table(hits.map(x => [x.g.name, x.r.avg + " fps", x.r.low + " fps", "到達"]));
}
function renderReverse() {
  const game = games.find(g => g.id === $("game").value);
  if (!game) return;
  const target = Number($("target").value) || 244;
  const rows = [];
  gpus.forEach(gpu => {
    const ok = cpus.filter(cpu => calc(game, cpu, gpu).avg >= target)
      .sort((a, b) => a.f - b.f);
    if (ok.length) {
      const weak = ok[0];
      const best = ok[ok.length - 1];
      const sample = calc(game, best, gpu);
      rows.push([gpu.name, weak.name, best.name + "で " + sample.avg + " fps", "到達"]);
    }
  });
  $("outTitle").textContent = game.name + " / " + target + "fps の逆引き";
  $("avg").innerHTML = rows.length + " <span>通り</span>";
  $("low").textContent = $("res").options[$("res").selectedIndex].text;
  $("bound").textContent = { low: "低", mid: "中", high: "高" }[$("preset").value] || "低";
  $("gap").textContent = "目標 " + target + " fps";
  $("lock").textContent = rows.length ? "候補あり" : "この条件では不足";
  $("badge").className = "badge " + (rows.length ? "ok" : "bad");
  $("badge").textContent = rows.length ? "候補あり" : "不足";
  $("note").textContent = "左のCPUは、そのGPUで目標平均に届く一番弱いCPU。右はそのリスト内で一番強いCPUの見積もり。";
  $("suggest").innerHTML = "<h2>目標fpsを超える組み合わせ</h2>" +
    (rows.length ? table(rows, ["GPU", "届く最弱CPU", "強CPU時", "判定"]) : "<p class='note'>解像度を下げるか目標fpsを下げると候補が出る。</p>");
}
function table(rows, heads = ["GPU", "平均", "1% Low", "判定"]) {
  return "<table><thead><tr>" + heads.map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map((c, i) => "<td class='" + (i === r.length - 1 ? "hit" : "") + "'>" + c + "</td>").join("") + "</tr>").join("") +
    "</tbody></table>";
}
function run() { mode === "fwd" ? renderForward() : renderReverse(); }
function boot() {
  fill($("game"), games);
  fill($("cpu"), cpus);
  fill($("gpu"), gpus);
  $("game").value = "apex";
  $("cpu").value = "7800x3d";
  $("gpu").value = "9070";
  run();
}
document.querySelectorAll(".q").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".q").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  $("preset").value = btn.dataset.q;
  run();
}));
["game", "cpu", "gpu", "ram", "res", "preset", "target"].forEach(id => $(id).addEventListener("input", run));
$("qCpu").addEventListener("input", e => { fill($("cpu"), cpus, e.target.value); run(); });
$("qGpu").addEventListener("input", e => { fill($("gpu"), gpus, e.target.value); run(); });
$("go").addEventListener("click", run);
$("tabFwd").addEventListener("click", () => {
  mode = "fwd";
  $("tabFwd").classList.add("on");
  $("tabRev").classList.remove("on");
  $("fwdFields").style.display = "";
  run();
});
$("tabRev").addEventListener("click", () => {
  mode = "rev";
  $("tabRev").classList.add("on");
  $("tabFwd").classList.remove("on");
  $("fwdFields").style.display = "none";
  run();
});
boot();
</script>
</body>
</html>
